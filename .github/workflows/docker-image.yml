name: 'Docker 镜像构建'
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: '构建 Docker 镜像'
      run: |
        docker build -t fasteredge2api .
    - name: '导出并上传镜像工件'
      run: |
        docker save fasteredge2api | gzip > fasteredge2api-image.tar.gz
    - uses: actions/upload-artifact@v4
      with:
        name: 'fasteredge2api-docker-image-${{ github.ref_name }}'
        path: 'fasteredge2api-image.tar.gz'
        if-no-files-found: 'warn'
        retention-days: 14
